name: GeekNews 수집

on:
  schedule:
    - cron: "17 * * * *"   # 매시간 RSS(최근 20개)를 읽어 raw/D.json 에 누적
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        id: run
        env:
          TZ: Asia/Seoul
        run: |
          set +e
          python3 tools/collect.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 커밋
        run: |
          git config user.name "ai-trend-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "수집: RSS 누적 $(date +%F_%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: 결과 확인
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::RSS 수집 실패. 로그를 확인하세요."
          exit 1
