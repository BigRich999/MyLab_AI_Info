name: GeekNews 수집

on:
  schedule:
    - cron: "30 17 * * *"   # 매일 02:30 KST (GitHub 예약은 늦어질 수 있어 03:57 발간보다 일찍)
  workflow_dispatch:
    inputs:
      date:
        description: "발간일 D (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        id: run
        env:
          TZ: Asia/Seoul
        run: |
          set +e
          python3 tools/collect.py ${{ github.event.inputs.date }}
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 커밋
        run: |
          git config user.name "ai-trend-collector"
          git config user.email "actions@users.noreply.github.com"
          git add raw/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "수집: raw $(ls -t raw | head -1)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: 결과 확인
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::수집 실패 또는 차단(status != ok). raw 파일의 fetchLog를 확인하세요."
          exit 1
